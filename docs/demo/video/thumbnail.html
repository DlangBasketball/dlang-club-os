<!doctype html>
<!-- Sales thumbnail source (1280x720). Render: headless Chrome screenshot at 1280x720. Matches the DLang Sports OS demo style. -->
<html><head><meta charset="utf-8"><style>
  html,body{margin:0;width:1280px;height:720px;overflow:hidden}
  body{font-family:"Open Sans","Inter",system-ui,sans-serif;color:#F7F2F2;
    background:radial-gradient(ellipse 70% 95% at 78% 50%,#4a1826 0%,#2c111b 48%,#160f14 100%);position:relative}
  .rings{position:absolute;left:810px;top:360px}
  .rings span{position:absolute;border:1.5px solid rgba(255,190,200,.16);border-radius:50%;transform:translate(-50%,-50%)}
  .line{position:absolute;left:990px;top:60px;width:1.5px;height:640px;background:rgba(255,190,200,.16)}
  .brand{position:absolute;left:72px;top:58px;display:flex;align-items:center;gap:14px;font-weight:700;font-size:22px}
  .tile{width:40px;height:40px;border-radius:9px;background:#DA2627;display:grid;place-items:center;font-weight:800;font-size:22px;color:#fff}
  .eyebrow{position:absolute;left:72px;top:188px;font-size:17px;font-weight:700;letter-spacing:.2em;color:#FF6B6B;text-transform:uppercase}
  h1{position:absolute;left:72px;top:212px;margin:0;font-size:74px;line-height:1.06;font-weight:800;letter-spacing:-.01em;width:760px}
  .flow{position:absolute;left:72px;top:500px;display:flex;align-items:center;gap:14px;font-size:21px;font-weight:600}
  .chip{padding:11px 18px;border-radius:10px;background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.14)}
  .chip.on{background:#DA2627;border-color:#DA2627}
  .arrow{color:#FF8A8A;font-size:24px}
  .cta{position:absolute;left:72px;top:600px;padding:14px 24px;border-radius:10px;background:#F0514D;color:#1b0b0f;font-weight:800;font-size:22px}
  .card{position:absolute;right:92px;top:258px;width:330px;padding:22px 24px;border-radius:16px;background:rgba(20,12,16,.82);border:1px solid rgba(255,255,255,.14);box-shadow:0 24px 60px rgba(0,0,0,.45)}
  .card small{display:block;font-size:14px;letter-spacing:.14em;text-transform:uppercase;color:#C9B8BC;font-weight:700}
  .card b{display:block;font-size:30px;margin:6px 0 14px}
  .row{display:flex;justify-content:space-between;font-size:18px;padding:9px 0;border-top:1px solid rgba(255,255,255,.1)}
  .ok{color:#5DD39E;font-weight:700}
</style></head><body>
  <div class="rings"><span style="width:200px;height:200px"></span><span style="width:340px;height:340px"></span><span style="width:480px;height:480px"></span><span style="width:620px;height:620px"></span></div>
  <div class="line"></div>
  <div class="brand"><div class="tile">D</div>DLang Sports OS</div>
  <div class="eyebrow">One athlete. Zero re-entry.</div>
  <h1>Registered. Approved. On the roster.</h1>
  <div class="flow"><span class="chip">Parent</span><span class="arrow">→</span><span class="chip">Club Admin</span><span class="arrow">→</span><span class="chip on">Coach</span></div>
  <div class="cta">Try the demo</div>
  <div class="card"><small>U14 Falcons · roster</small><b>Alex Morgan</b>
    <div class="row"><span>Registration</span><span class="ok">Approved</span></div>
    <div class="row"><span>Today's practice</span><span class="ok">Present</span></div>
  </div>
</body></html>
