# Seed placement for scripts/db-test.sh
#
# Format:  after <migration file name> <seed file path>
#          skip <seed file path>      (never loaded into test databases)
#
# Seeds listed here are loaded immediately after the named migration; every
# other file in supabase/seeds/ is loaded (in lexical order) after ALL
# migrations. New migrations need no entry here — they are picked up by glob.
#
# Why seed.sql is loaded early: several historical migrations contain
# founding-club data that assumes DLang's organization (…0001) and coach
# Derrick (…0011) already exist:
#   20250420090500_public_registration.sql  inserts consent_forms for org …0001
#   20250420090900_attendance_module.sql    updates app_settings for org …0001
#   20250420091000_parent_bookings.sql      inserts coach_availability for coach …0011
#   20250420091100_booking_module.sql       updates app_settings
#   20250420091300_documents_consent.sql    inserts consent_forms for org …0001
# On an EMPTY database (e.g. a brand-new white-label tenant project) those
# migrations fail with FK violations. TODO(tenancy): move that data into
# seeds or guard it with `where exists (...)`, then delete the line below so
# the harness proves migrations apply to an empty database.
after 20250420090200_functions_rls.sql supabase/seeds/seed.sql

# seed_demo.sql is the synthetic staging/sales-demo seed. It reuses org …0001
# with its own fixtures (e.g. training_services slugs) and is meant for a
# staging project WITHOUT seed.sql, so it conflicts with the test fixtures.
skip supabase/seeds/seed_demo.sql

# training_dlang.sql is a hand-run demo data script (DLang Pro Training set-up),
# not a fixture; tests/db/training_packages.sql runs it explicitly (twice).
skip supabase/seeds/training_dlang.sql
