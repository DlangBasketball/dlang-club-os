name: CI

# Quality gate (TESTING_AND_LAUNCH_PLAN.md §2):
#   lint → typecheck → unit → DB integration (migrations + RLS + tenant isolation) → build
# plus a non-blocking dependency audit and a secret scan. Block merges on red
# by marking the "quality gate" check as required in branch protection.

on:
  push:
    branches: [main, "claude/**", "wf/**"]
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: "17 3 * * *" # nightly: also runs the e2e smoke job

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  NODE_VERSION: "22"
  NEXT_TELEMETRY_DISABLED: "1"
  # Dummy, non-secret values so `next build` and the e2e server can start.
  NEXT_PUBLIC_SUPABASE_URL: "https://placeholder.supabase.co"
  NEXT_PUBLIC_SUPABASE_ANON_KEY: "placeholder-anon-key"
  SUPABASE_SERVICE_ROLE_KEY: "placeholder-server-key"
  NEXT_PUBLIC_SITE_URL: "http://localhost:3100"

jobs:
  checks:
    name: lint · typecheck · unit
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - name: Lint
        run: npm run lint
      - name: Typecheck
        run: npm run typecheck
      - name: Unit tests
        run: npm run test:unit

  db:
    name: DB integration (migrations · RLS · tenant isolation · money logic)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      PGHOST: localhost
      PGPORT: "5432"
      PGUSER: postgres
      PGPASSWORD: postgres
    steps:
      - uses: actions/checkout@v4
      - name: Ensure psql client
        run: command -v psql || (sudo apt-get update && sudo apt-get install -y postgresql-client)
      - name: Migrations + seeds + SQL suites
        run: bash scripts/db-test.sh
      - name: List tracked known findings (XFAIL)
        if: always()
        run: VERBOSE=1 EMPTY_DB_CHECK=off bash scripts/db-test.sh tests/db/tenant_isolation.sql tests/db/money_logic.sql | grep -E "XFAIL|XPASS" || true

  build:
    name: build
    runs-on: ubuntu-latest
    needs: [checks]
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - name: Build
        run: npm run build

  quality-gate:
    name: quality gate
    runs-on: ubuntu-latest
    needs: [checks, db, build]
    if: always()
    steps:
      - name: All required jobs green
        run: |
          echo "checks=${{ needs.checks.result }} db=${{ needs.db.result }} build=${{ needs.build.result }}"
          test "${{ needs.checks.result }}" = success
          test "${{ needs.db.result }}" = success
          test "${{ needs.build.result }}" = success

  audit:
    name: npm audit (non-blocking)
    runs-on: ubuntu-latest
    continue-on-error: true
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: npm audit (production deps, high+)
        run: npm audit --omit=dev --audit-level=high
      - name: npm audit (all deps, report only)
        if: always()
        run: npm audit || true

  secrets:
    name: secret scan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Required only for repositories owned by an organization account.
          GITLEAKS_LICENSE: ${{ secrets.GITLEAKS_LICENSE }}

  e2e:
    name: e2e smoke (nightly / manual)
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    needs: [build]
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run build
      - name: Playwright
        run: npm run test:e2e -- --project=chromium-desktop --project=chromium-mobile
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: playwright-report
          retention-days: 7
